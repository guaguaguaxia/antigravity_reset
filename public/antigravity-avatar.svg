      <circle cx="64" cy="64" r="64" />
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip)">
    <rect width="128" height="128" fill="#ffd84d" />
    <circle cx="24" cy="24" r="5" fill="#26201a" fill-opacity="0.08" />
    <circle cx="52" cy="18" r="4" fill="#26201a" fill-opacity="0.08" />
    <circle cx="96" cy="26" r="5" fill="#26201a" fill-opacity="0.08" />
    <circle cx="106" cy="96" r="5" fill="#26201a" fill-opacity="0.08" />
    <circle cx="22" cy="98" r="4" fill="#26201a" fill-opacity="0.08" />

    <!-- Orbital ring -->
